# Railway Configuration for Coral Gables BI Platform
# Documentation: https://docs.railway.app/reference/config-as-code

[build]
# Build configuration - uses nixpacks.toml for detailed settings
builder = "NIXPACKS"
# Note: buildCommand moved to nixpacks.toml to avoid ARG/ENV security warnings

[deploy]
# Start command configured per-service in Railway dashboard
# - Terminal (API): uvicorn bi_api:app --host 0.0.0.0 --port $PORT
# - Terminal Cron Service: python weekly_refresh.py
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# SECURITY: Set environment variables in Railway dashboard (Variables tab)
# This ensures secrets are injected at RUNTIME only, not baked into image layers.
# Required variables:
# - ADMIN_API_KEY: API authentication key
# - GOOGLE_PLACES_API_KEY: Google Places API for business data
# - YELP_API_KEY: Yelp Fusion API for reviews
# - ANTHROPIC_API_KEY: Claude API for AI analysis
# - DATABASE_URL: PostgreSQL connection string (auto-set by Railway)

# Note: Railway cron jobs are configured via the dashboard
# Go to: Project Settings → Cron → Add Cron Job
#
# Recommended cron schedule for weekly refresh:
# Schedule: 0 6 * * 0  (Every Sunday at 6 AM UTC)
# Command: python weekly_refresh.py --businesses 100
#
# Alternative schedules:
# - Daily: 0 6 * * *
# - Every Monday: 0 6 * * 1
# - Bi-weekly: 0 6 1,15 * *
