# Knowledge Graph — Neo4j + ETL
# Usage:
#   cd data/etl
#   docker compose up -d          # start Neo4j
#   docker compose down            # stop
#   docker compose down -v         # stop + delete data
#
# Neo4j Browser: http://localhost:7474
# Bolt endpoint:  bolt://localhost:7687
# Default creds:  neo4j / cgcc2024graph

services:
  neo4j:
    image: neo4j:5-community
    container_name: cgcc-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP (Neo4j Browser)
      - "7687:7687"   # Bolt (driver connections)
    environment:
      NEO4J_AUTH: neo4j/cgcc2024graph
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./import:/var/lib/neo4j/import   # CSV drop zone for LOAD CSV
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  neo4j_data:
  neo4j_logs:
